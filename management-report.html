<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#138FCB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JS Traders - Executive Management Reporting</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center bg-slate-950 p-0 sm:p-4 overflow-hidden">

  <!-- Mobile/Tablet Viewport Frame -->
  <div id="mobile-viewport" class="w-full h-full sm:max-w-[480px] sm:max-h-[900px] bg-slate-50 flex flex-col sm:rounded-[36px] sm:border-[8px] sm:border-slate-800 sm:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] overflow-hidden relative">

    <!-- Top Mobile Header -->
    <header class="bg-[#138FCB] text-white px-4 py-3 shrink-0 shadow-sm safe-top z-20 space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center font-black text-sm italic">
            JS
          </div>
          <div>
            <span class="text-[9px] uppercase font-bold text-blue-100 tracking-wider block leading-none">Executive Insights</span>
            <span class="text-xs font-black tracking-tight mt-0.5 block">Management Reports</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Portals Switcher Launcher -->
          <button id="report-portals-btn" type="button" title="Portals" class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white/20 hover:bg-white/30 text-white text-[10px] font-bold cursor-pointer active:scale-95 transition-all">
            <span>🌐</span>
            <span class="hidden xs:inline">Portals</span>
          </button>

          <!-- Back to Main ERP -->
          <a href="index.html" class="px-2 py-1 rounded-xl bg-black/20 text-white text-[10px] font-bold hover:bg-black/30">
            ERP
          </a>

          <!-- Role Preview Switcher -->
          <div class="flex items-center gap-1 bg-black/20 rounded-xl px-2 py-1 text-[10px] font-bold">
            <span class="text-blue-200">👤</span>
            <select id="report-role-switcher" class="bg-transparent text-white font-bold focus:outline-none cursor-pointer">
              <option value="owner" class="text-slate-900">Owner (Full Value)</option>
              <option value="warehouse_manager" class="text-slate-900">Warehouse Manager</option>
              <option value="sales_person" class="text-slate-900">Sales Representative</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Location Filter Bar -->
      <div class="flex items-center justify-between gap-1 bg-white/15 p-1 rounded-xl text-[11px] font-bold">
        <button class="loc-filter-btn flex-1 py-1 rounded-lg text-center cursor-pointer transition-all bg-white text-[#138FCB] shadow-2xs font-bold" data-loc="all">
          All Facilities
        </button>
        <button class="loc-filter-btn flex-1 py-1 rounded-lg text-center cursor-pointer transition-all text-white/80 hover:text-white" data-loc="wh-1">
          Warehouse
        </button>
        <button class="loc-filter-btn flex-1 py-1 rounded-lg text-center cursor-pointer transition-all text-white/80 hover:text-white" data-loc="wh-2">
          Office
        </button>
      </div>
    </header>

    <!-- Main Content Workspace (Scrollable) -->
    <main id="mobile-report-content" class="flex-1 overflow-y-auto no-scrollbar p-3.5 space-y-4 bg-[#F8FAFC]">
      <!-- Dynamically injected by mobileReportsApp.js -->
      <div class="h-full flex items-center justify-center">
        <div class="text-center space-y-2">
          <div class="w-8 h-8 border-3 border-[#138FCB] border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-xs text-slate-400 font-medium">Loading Management Reports...</p>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar with 5 Executive Focus Areas -->
    <nav class="bg-white border-t border-slate-200 px-2 py-2 shrink-0 safe-bottom z-20 flex justify-around items-center shadow-lg">
      <button class="report-nav-item flex flex-col items-center gap-1 text-[#138FCB] cursor-pointer" data-tab="stock-explorer">
        <span class="text-base sm:text-lg">📦</span>
        <span class="text-[9px] sm:text-[10px] font-bold">Stock & Value</span>
      </button>
      <button class="report-nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 cursor-pointer" data-tab="customer-ledgers">
        <span class="text-base sm:text-lg">👥</span>
        <span class="text-[9px] sm:text-[10px] font-bold">All Ledgers</span>
      </button>
      <button class="report-nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 cursor-pointer" data-tab="shipments-tracking">
        <span class="text-base sm:text-lg">🚢</span>
        <span class="text-[9px] sm:text-[10px] font-bold">Shipments</span>
      </button>
      <button class="report-nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 cursor-pointer" data-tab="by-location">
        <span class="text-base sm:text-lg">🏢</span>
        <span class="text-[9px] sm:text-[10px] font-bold">Locations</span>
      </button>
      <button class="report-nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 cursor-pointer" data-tab="low-stock">
        <span class="text-base sm:text-lg">⚠️</span>
        <span class="text-[9px] sm:text-[10px] font-bold">Deficits</span>
      </button>
    </nav>

  </div>

  <!-- Toast Container -->
  <div id="report-toast-container" class="fixed top-4 inset-x-4 max-w-[380px] mx-auto z-50 pointer-events-none space-y-2"></div>

  <!-- Mobile Reports Controller ES Module -->
  <script type="module" src="assets/js/mobileReportsApp.js"></script>
</body>
</html>
