plugins { id 'com.android.application' }

// version comes from CI (run number) so every build can be installed over the previous one
def vCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer

android {
    namespace 'shop.jstradersokr.picking'
    compileSdk 34
    defaultConfig {
        applicationId 'shop.jstradersokr.picking'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
        buildConfigField "String", "APP_URL", "\"https://js-traders-accounts-app-1fsw.vercel.app\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
